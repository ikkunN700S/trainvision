<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>トレインビジョン</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header-bar">
    <div id="train-type" class="train-type">普通</div>
    <div id="station" class="station">
      <span id="last-station-name" class="last-station-name">浜松</span>
      <span id="railway" class="railway">CA</span>
      <span id="last-station-number" class="last-station-number">34</span>
      行
    </div>

    <div class="next-station-label">
      <span>つぎは</span>
      <span id="next-station-name" class="next-station-name">浜松</span>
    </div>

    <div id="car-number" class="car-number">1号車</div>
  </div>

  <div class="station-information">
    <div class="station">
      <span class="station-name">浜松</span>
      <span class="railway">CA</span>
      <span class="station-number">34</span>
      <span class="change-train"></span>
    </div>
    <!-- やじるし -->
  </div>

  <div class="station-list" id="station-list"></div>

  <script src="app.js"></script>
</body>
</html>
