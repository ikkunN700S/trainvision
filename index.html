<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Vision Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="lcd-monitor">
        <div class="top-color-bar"></div>
        <header class="header-info">
            
            <div class="train-type-wrapper">
                <div class="train-type kanji active" id="type-kanji"><span class="inner">各駅停車</span></div>
                <div class="train-type kana" id="type-kana"><span class="inner">かくえきていしゃ</span></div>
                <div class="train-type en" id="type-en"><span class="inner">Local</span></div>
            </div>

            <div class="destination-wrapper">
                <div class="destination kanji active" id="dest-kanji"><span class="inner">新宿 行</span></div>
                <div class="destination kana" id="dest-kana"><span class="inner">しんじゅく ゆき</span></div>
                <div class="destination en" id="dest-en"><span class="inner">for Shinjuku</span></div>
            </div>

            <div class="car-number-wrapper">
                <div class="car-number kanji active" id="car-kanji">
                    <span class="number-wrap"><span class="number">1</span></span><span class="unit">号車</span>
                </div>
                <div class="car-number kana" id="car-kana">
                    <span class="number-wrap"><span class="number">1</span></span><span class="unit">ごうしゃ</span>
                </div>
                <div class="car-number en" id="car-en">
                    <div class="car-en-text">
                        <span>Car</span>
                        <span>No.</span>
                    </div>
                    <span class="number-wrap"><span class="number">1</span></span>
                </div>
            </div>
        </header>

        <div class="next-station-area">
            
            <div class="next-label-wrapper">
                <div class="next-label kanji active" id="next-kanji"><span class="inner">つぎは</span></div>
                <div class="next-label kana" id="next-kana"><span class="inner">つぎは</span></div>
                <div class="next-label en" id="next-en"><span class="inner">Next</span></div>
            </div>

            <div class="station-number-box">
                <div class="line-code">JA</div>
                <div class="st-num">01</div>
            </div>
            
            <div class="station-name-wrapper" id="station-name-wrapper">
                <div class="station-name kanji active" id="st-kanji"><span class="inner">新宿</span></div>
                <div class="station-name kana" id="st-kana"><span class="inner">しんじゅく</span></div>
                <div class="station-name en" id="st-en"><span class="inner">SHINJUKU</span></div>
            </div>
        </div>
        
        <div class="separator-bar"></div>
        
        <main class="main-content">
            <div class="route-map-grid">
                
                <div class="grid-item row-1"></div>
                <div class="grid-item st-name-vert row-1"><div class="st-name-inner">八駅目</div></div>
                <div class="grid-item st-name-vert row-1"><div class="st-name-inner">七駅目</div></div>
                <div class="grid-item st-name-vert row-1"><div class="st-name-inner">六駅目</div></div>
                <div class="grid-item st-name-vert row-1"><div class="st-name-inner">五駅目</div></div>
                <div class="grid-item st-name-vert row-1"><div class="st-name-inner">四駅目</div></div>
                <div class="grid-item st-name-vert row-1"><div class="st-name-inner">三駅目</div></div>
                <div class="grid-item st-name-vert grey-text row-1"><div class="st-name-inner">二駅目</div></div>
                <div class="grid-item st-name-vert row-1"><div class="st-name-inner">一駅目</div></div>

                <div class="grid-item row-2"></div>
                <div class="grid-item st-id row-2">JA-08</div>
                <div class="grid-item st-id row-2">JA-07</div>
                <div class="grid-item st-id row-2">JA-06</div>
                <div class="grid-item st-id row-2">JA-05</div>
                <div class="grid-item st-id row-2">JA-04</div>
                <div class="grid-item st-id row-2">JA-03</div>
                <div class="grid-item st-id grey-text row-2">JA-02</div>
                <div class="grid-item st-id row-2">JA-01</div>

                <div class="time-bar-bg"></div>
                
                <div class="grid-item time-label row-3">分</div>
                <div class="grid-item row-3"><div class="time-box">35</div></div>
                <div class="grid-item row-3"><div class="time-box">30</div></div>
                <div class="grid-item row-3"><div class="time-box">25</div></div>
                <div class="grid-item row-3"><div class="time-box">20</div></div>
                <div class="grid-item row-3"><div class="time-box">15</div></div>
                <div class="grid-item row-3"><div class="time-box">10</div></div>
                <div class="grid-item row-3"><div class="white-chevron"></div></div>
                
                <div class="grid-item row-3 red-chevron-container">
                    <div class="time-box-bg"></div>
                    <div class="red-chevron-large"></div>
                </div>
            </div>

            <div class="footer-note">
                のりかえ、待ち合わせ時間は含まれません。電車により多少時間は異なります。
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
