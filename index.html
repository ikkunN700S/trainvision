<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Vision Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="lcd-monitor">
        <div class="top-color-bar"></div>
        <header class="header-info">
            <div class="train-type-wrapper">
                <div class="train-type ja active" id="type-ja">各駅停車</div>
                <div class="train-type en" id="type-en">Local</div>
            </div>

            <div class="destination-wrapper">
                <div class="destination ja active" id="dest-ja">行き先 行</div>
                <div class="destination en" id="dest-en">for Destination</div>
            </div>

            <div class="car-number">
                <span class="number">1</span><span class="unit">号車</span>
            </div>
        </header>

        <div class="next-station-area">
            <div class="next-label-wrapper">
                <div class="next-label ja active" id="next-ja">つぎは</div>
                <div class="next-label en" id="next-en">Next</div>
            </div>

            <div class="station-number-box">
                <div class="line-code">JA</div>
                <div class="st-num">01</div>
            </div>
            
            <div class="station-name-wrapper" id="station-name-wrapper">
                <div class="station-name ja active" id="st-ja">えきめい</div>
                <div class="station-name en" id="st-en">E K I M E I</div>
            </div>
        </div>
        
        <div class="separator-bar"></div>
        
        <main class="main-content">
            <div class="route-map-grid">
                
                <div class="grid-item row-1"></div>
                <div class="grid-item st-name-vert row-1">八駅目</div>
                <div class="grid-item st-name-vert row-1">七駅目</div>
                <div class="grid-item st-name-vert row-1">六駅目</div>
                <div class="grid-item st-name-vert row-1">五駅目</div>
                <div class="grid-item st-name-vert row-1">四駅目</div>
                <div class="grid-item st-name-vert row-1">三駅目</div>
                <div class="grid-item st-name-vert grey-text row-1">二駅目</div>
                <div class="grid-item st-name-vert row-1">一駅目</div>

                <div class="grid-item row-2"></div>
                <div class="grid-item st-id row-2">JA-08</div>
                <div class="grid-item st-id row-2">JA-07</div>
                <div class="grid-item st-id row-2">JA-06</div>
                <div class="grid-item st-id row-2">JA-05</div>
                <div class="grid-item st-id row-2">JA-04</div>
                <div class="grid-item st-id row-2">JA-03</div>
                <div class="grid-item st-id grey-text row-2">JA-02</div>
                <div class="grid-item st-id row-2">JA-01</div>

                <div class="time-bar-bg"></div>
                
                <div class="grid-item time-label row-3">分</div>
                <div class="grid-item row-3"><div class="time-box">35</div></div>
                <div class="grid-item row-3"><div class="time-box">30</div></div>
                <div class="grid-item row-3"><div class="time-box">25</div></div>
                <div class="grid-item row-3"><div class="time-box">20</div></div>
                <div class="grid-item row-3"><div class="time-box">15</div></div>
                <div class="grid-item row-3"><div class="time-box">10</div></div>
                <div class="grid-item row-3"><div class="white-chevron"></div></div>
                
                <div class="grid-item row-3">
                    <div class="time-box">
                        <div class="red-chevron"></div>
                    </div>
                </div>
            </div>

            <div class="footer-note">
                のりかえ、待ち合わせ時間は含まれません。電車により多少時間は異なります。
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
