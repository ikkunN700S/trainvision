<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>トレインビジョン</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="train-vision-container">
        <header class="header">
            <div class="train-type">普通</div>
            <div class="current-station">静岡</div>
            <div class="station-code">CA<span class="code-number">17</span></div>
            <div class="direction">行</div>
            <div class="car-number">4号車</div>
        </header>

        <main class="main-content">
            <div class="station-list">
                <div class="station-item">
                    <div class="station-name">熱海</div>
                    <div class="station-code">CA<span class="code-number">00</span></div>
                </div>
                <div class="station-item">
                    <div class="station-name">三島</div>
                    <div class="station-code">CA<span class="code-number">01</span></div>
                </div>
                <div class="station-item">
                    <div class="station-name">沼津</div>
                    <div class="station-code">CA<span class="code-number">02</span></div>
                </div>
                <div class="station-item">
                    <div class="station-name">片浜</div>
                    <div class="station-name-small">片</div>
                    <div class="station-code">CA<span class="code-number">03</span></div>
                </div>
                <div class="station-item">
                    <div class="station-name">原</div>
                    <div class="station-code">CA<span class="code-number">04</span></div>
                </div>
                <div class="station-item">
                    <div class="station-name">東田子の浦</div>
                    <div class="station-name-small">東田子の浦</div>
                    <div class="station-code">CA<span class="code-number">05</span></div>
                </div>
                <div class="station-item">
                    <div class="station-name">吉原</div>
                    <div class="station-code">CA<span class="code-number">06</span></div>
                </div>
                <div class="station-item">
                    <div class="station-name">岳南電車</div>
                    <div class="station-code">CA<span class="code-number">07</span></div>
                </div>
                <!-- Add more stations as needed -->
            </div>
            <div class="station-track">
                <div class="track-line"></div>
                <div class="station-marker current"></div>
                <!-- Markers for other stations -->
                <div class="station-marker" style="left: 10%;"></div>
                <div class="station-marker" style="left: 20%;"></div>
                <div class="station-marker" style="left: 30%;"></div>
                <div class="station-marker" style="left: 40%;"></div>
                <div class="station-marker" style="left: 50%;"></div>
                <div class="station-marker" style="left: 60%;"></div>
                <div class="station-marker" style="left: 70%;"></div>
                <div class="station-marker" style="left: 80%;"></div>
                <div class="station-marker" style="left: 90%;"></div>
            </div>
            <div class="line-info">
                <div class="line-segment">
                    <input type="checkbox" id="shinkansen" checked>
                    <label for="shinkansen">新幹線</label>
                </div>
                <div class="line-segment">
                    <input type="checkbox" id="gotemba" checked>
                    <label for="gotemba">御殿場線</label>
                </div>
                <div class="line-segment">
                    <input type="checkbox" id="izuhakone" checked>
                    <label for="izuhakone">伊豆箱根鉄道</label>
                </div>
                <div class="line-segment">
                    <input type="checkbox" id="odarato" checked>
                    <label for="odarato">小田原・東京方面</label>
                </div>
                <div class="line-segment">
                    <input type="checkbox" id="ito" checked>
                    <label for="ito">伊東線</label>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
